name: Strip PR attribution

# Removes tool footers that sessions add to PR descriptions and comments.
# Runs from the default branch, so it also covers PRs opened before a merge.

on:
  pull_request_target:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  pull-requests: write
  issues: write

jobs:
  strip:
    if: >-
      contains(github.event.pull_request.body, 'claude') ||
      (github.event.issue.pull_request && contains(github.event.comment.body, 'claude'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const patterns = [
              /<!--\s*claude-projects-attribution:[\s\S]*?-->/g,
              /^[ \t]*_Requested by \*\*[^*\r\n]*\*\*[^\r\n]*_[ \t]*$/gm,
              /^[ \t]*_?Generated by \[?Claude Code\]?(\([^)\r\n]*\))?_?[ \t]*$/gm,
              /^[ \t]*🤖 Generated with \[Claude Code\]\([^)\r\n]*\)[ \t]*$/gm,
              /^[ \t]*https:\/\/claude\.ai\/code\/session_\S+[ \t]*$/gm,
              /^[ \t]*Co-Authored-By: Claude[^\r\n]*$/gim,
              /^[ \t]*Claude-Session:[^\r\n]*$/gim,
            ];

            function clean(text) {
              const stripped = patterns.reduce((out, p) => out.replace(p, ''), text);
              if (stripped === text) return text;
              return stripped.replace(/(?:^|\r?\n)[ \t]*---\s*$/, '').trim();
            }

            const { owner, repo } = context.repo;
            const { pull_request: pr, comment } = context.payload;

            if (pr) {
              const body = clean(pr.body);
              if (body !== pr.body) {
                await github.rest.pulls.update({ owner, repo, pull_number: pr.number, body });
              }
              return;
            }

            const body = clean(comment.body);
            if (body === comment.body) return;
            // Copilot status notes belong in the task, not on the PR.
            if (!body.trim() || body.includes('copilot-pull-request-reviewer')) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });
            } else {
              await github.rest.issues.updateComment({ owner, repo, comment_id: comment.id, body });
            }
